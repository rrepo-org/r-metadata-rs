[package]
name = "r-description-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lossless, failure-tolerant R DESCRIPTION metadata"
documentation = "https://docs.rs/r-description-parser"
readme = "README.md"
keywords = ["r", "description", "cran", "parser", "metadata"]
categories = ["parser-implementations"]
exclude = ["tests/cran_corpus.rs", "tests/cran_properties.rs"]

[lib]
name = "r_description"

[dependencies]
r-dcf-syntax = { version = "0.1.0", path = "../r-dcf-syntax" }
r-metadata = { version = "0.1.0", path = "../r-metadata" }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions.workspace = true

[lints]
workspace = true
